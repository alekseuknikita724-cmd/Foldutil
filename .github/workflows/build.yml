{"name":"build","on":["workflow_dispatch","push"],"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"21"}},{"run":"ls -la\nS=FoldUtil-src.zip\nT=\"\"\nfor f in *.zip *.jar; do\n  if [ -f \"$f\" ] && [ \"$f\" != \"$S\" ]; then\n    if unzip -l \"$f\" 2>/dev/null | grep -q gradlew; then T=\"$f\"; fi\n  fi\ndone\necho \"template=$T\"\nmkdir t\nif [ -n \"$T\" ]; then\n  unzip -q \"$T\" -d t\nelse\n  git clone --depth 1 --branch 1.21.11 https://github.com/FabricMC/fabric-example-mod t/x || git clone --depth 1 https://github.com/FabricMC/fabric-example-mod t/x\nfi\nG=$(find t -name gradlew -print -quit)\necho \"gradlew=$G\"\nD=$(dirname \"$G\")\nrm -rf \"$D/src\"\nunzip -q \"$S\" -d \"$D\"\ncd \"$D\"\nif grep -q splitEnvironmentSourceSets build.gradle; then mkdir -p src/client && mv src/main/java src/client/java; fi\nchmod +x gradlew\n./gradlew build --no-daemon\nmkdir -p \"$GITHUB_WORKSPACE/out\"\nfor j in build/libs/*.jar; do case \"$j\" in *sources*) ;; *) cp \"$j\" \"$GITHUB_WORKSPACE/out/\";; esac; done\nls \"$GITHUB_WORKSPACE/out\""},{"uses":"actions/upload-artifact@v4","with":{"name":"mod","path":"out/*.jar"}}]}}}
