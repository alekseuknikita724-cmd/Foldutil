{"name":"build","on":["workflow_dispatch","push"],"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"21"}},{"name":"Build mod","run":"git clone https://github.com/FabricMC/fabric-example-mod t\ncd t\nC=\"\"\nfor c in $(git log --format=%H -- gradle.properties); do\n  git show \"$c:gradle.properties\" > /tmp/gp 2>/dev/null || true\n  if grep -Eq '^minecraft_version\\s*=\\s*1\\.21\\.11\\s*$' /tmp/gp; then C=\"$c\"; break; fi\ndone\necho \"commit=$C\"\nif [ -z \"$C\" ]; then echo \"NO 1.21.11 COMMIT FOUND\"; exit 1; fi\ngit checkout -q \"$C\"\ncat gradle.properties\nrm -rf src\nunzip -q ../FoldUtil-src.zip -d .\nif grep -q splitEnvironmentSourceSets build.gradle; then mkdir -p src/client && mv src/main/java src/client/java; fi\nchmod +x gradlew\n./gradlew build --no-daemon\nmkdir -p \"$GITHUB_WORKSPACE/out\"\nfor j in build/libs/*.jar; do case \"$j\" in *sources*) ;; *) cp \"$j\" \"$GITHUB_WORKSPACE/out/\";; esac; done\nls \"$GITHUB_WORKSPACE/out\""},{"uses":"actions/upload-artifact@v4","with":{"name":"mod","path":"out/*.jar"}}]}}}
