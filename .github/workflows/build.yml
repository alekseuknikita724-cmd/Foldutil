{"name":"build","on":["workflow_dispatch","push"],"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"21"}},{"run":"ls\nT=\"\"\nS=\"\"\nfor z in *.zip *.jar; do\n[ -f \"$z\" ] || continue\nif unzip -l \"$z\" | grep -q gradlew; then T=\"$z\"; else S=\"$z\"; fi\ndone\necho \"template=$T src=$S\"\nmkdir t && unzip -q \"$T\" -d t\nD=$(dirname \"$(find t -name gradlew | head -1)\")\nrm -rf \"$D/src\"\nunzip -q \"$S\" -d \"$D\"\ncd \"$D\"\nchmod +x gradlew\n./gradlew build\nmkdir -p \"$GITHUB_WORKSPACE/out\"\ncp build/libs/*.jar \"$GITHUB_WORKSPACE/out/\""},{"uses":"actions/upload-artifact@v4","with":{"name":"mod","path":"out/*.jar"}}]}}}
